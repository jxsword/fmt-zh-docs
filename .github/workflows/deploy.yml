name: Deploy Chinese Site

on:
  push:
    branches: [main]
    paths:
      - 'zh/**'
      - 'mkdocs.yml'
      - 'config/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      version:
        description: '部署版本 (如 12.2)，留空部署 latest'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-mike mkdocs-pdf-export mkdocs-git-revision-date-localized-plugin pyyaml

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build site with mike
        run: |
          if [ "${{ steps.version.outputs.version }}" = "latest" ]; then
            mike deploy --push --update-aliases latest
          else
            mike deploy --push ${{ steps.version.outputs.version }}
          fi

      - name: Build PDF for version
        if: steps.version.outputs.version != 'latest'
        run: |
          mike serve --no-livereload --dev-addr=127.0.0.1:8000 &
          sleep 5
          python -m mkdocs_pdf_export --site-dir site --output-dir pdf
          # PDF 生成可能需要额外配置，此处为示例

      - name: Upload PDF artifact
        if: steps.version.outputs.version != 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: fmt-zh-${{ steps.version.outputs.version }}-pdf
          path: pdf/
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: fmt 中文文档 ${{ github.ref_name }}
          body: |
            fmt 库中文文档 ${{ github.ref_name }} 版本发布。
            
            - 在线阅读: https://your-org.github.io/fmt-zh-docs/${{ github.ref_name }}/
            - PDF 下载: 见 Release Assets
          files: |
            pdf/*.pdf
          draft: false
          prerelease: false

  notify_failure:
    needs: [build, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Auto] Deploy failed',
              body: 'The deploy workflow failed. Please check the workflow run for details.',
              labels: ['deploy', 'failure', 'automated']
            })