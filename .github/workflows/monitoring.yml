name: Monitoring & Alerts

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Upstream Documentation", "Incremental Translation", "Validate Translations", "Deploy Chinese Site"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  check_sync_freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Check upstream freshness
        id: freshness
        run: |
          python -c "
import json, subprocess, sys
from datetime import datetime, timezone

# 检查本地状态
with open('.translation-state.json') as f:
    state = json.load(f)

local_commit = state.get('upstream_commit', '')
if not local_commit:
    print('No upstream commit in state')
    sys.exit(0)

# 获取上游最新 commit
try:
    result = subprocess.run(
        ['git', 'ls-remote', 'https://github.com/fmtlib/fmt.git', 'HEAD'],
        capture_output=True, text=True, check=True
    )
    upstream_commit = result.stdout.split()[0]
except Exception as e:
    print(f'Failed to get upstream commit: {e}')
    sys.exit(0)

if local_commit != upstream_commit:
    # 计算差异天数（简化版）
    print(f'Upstream has new commits: {local_commit[:8]} -> {upstream_commit[:8]}')
    print('stale=true' if True else 'stale=false')
    # 实际应用中应计算准确的天数差异
    print('days_since_update=1')  # 占位符
else:
    print('Upstream is in sync')
    print('stale=false')
    print('days_since_update=0')
          "

      - name: Alert on stale translation
        if: steps.freshness.outputs.stale == 'true' && steps.freshness.outputs.days_since_update|int >= 14
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Monitor] Upstream sync overdue (>14 days)',
              body: 'The upstream fmt documentation has been updated but local translation has not been synced for over 14 days.',
              labels: ['monitoring', 'stale', 'automated']
            })

  check_workflow_failures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Alert on workflow failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Monitor] Workflow failed: ${run.name}`,
              body: `Workflow **${run.name}** (run #${run.run_number}) failed.\n\n[View run](${run.html_url})`,
              labels: ['monitoring', 'workflow-failure', 'automated']
            })

  check_quality_metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run validation to collect metrics
        id: metrics
        run: |
          python scripts/validate_translation.py 2>&1 | tee validation_output.txt
          # 解析输出获取指标
          # 这里简化处理，实际应解析详细指标
          echo "terminology_consistency=99" >> $GITHUB_OUTPUT

      - name: Alert on quality drop
        if: steps.metrics.outputs.terminology_consistency|int < 95
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Monitor] Translation quality drop detected',
              body: 'Terminology consistency rate dropped below 95%. Please review recent translations.',
              labels: ['monitoring', 'quality', 'automated']
            })

  check_llm_cost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    steps:
      - name: Check LLM cost (placeholder)
        run: |
          echo "LLM cost monitoring not yet implemented"
          # 实际应用中应从计费系统获取成本数据
          # 如果日成本 > $1，创建告警 Issue