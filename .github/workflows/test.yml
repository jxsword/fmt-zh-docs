name: Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Run unit tests
        run: |
          # 门槛 45%：2026-11-19 实测覆盖率 48%（build_site/fix_links/rollback/
          # validate_code_examples 尚无测试）；M4 质量专项提升至 80%
          python -m pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=45

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          flags: unittests
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff lint
        run: |
          ruff check scripts/ tests/ --output-format=github

      # black --check 暂不启用：M1 历史代码未经格式化，全库格式统一留 M4 专项；
      # lint 门禁由 ruff（E4/E7/E9/F 真错误规则集）承担

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Run mypy type check
        run: |
          mypy scripts/ --ignore-missing-imports --strict || true