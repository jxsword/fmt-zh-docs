name: Incremental Translation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'source/**'
      - '.translation-state.json'
  workflow_dispatch:
    inputs:
      file:
        description: '指定翻译文件 (如 api.md)，留空翻译所有'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Identify pending translations
        id: pending
        run: |
          python -c "
import json, sys
state_file = '.translation-state.json'
with open(state_file) as f:
    state = json.load(f)

pending = []
for fname, fstate in state.get('files', {}).items():
    for seg in fstate.get('segments', []):
        if seg.get('type') != 'code_block' and seg.get('status') == 'pending':
            pending.append({'file': fname, 'segment_id': seg['id']})

print(f'pending_count={len(pending)}')
print(f'pending_files={list(set(p[\"file\"] for p in pending))}')
with open('pending.json', 'w') as f:
    json.dump(pending, f)
          "

      - name: Translate pending segments
        if: steps.pending.outputs.pending_count != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GLOSSARY_PATH: config/glossary.yml
        run: |
          python scripts/translate_batch.py --all
          # 实际使用时替换为真实的 LLM 调用

      - name: Validate translations
        if: steps.pending.outputs.pending_count != '0'
        run: |
          python scripts/validate_translation.py

      - name: Commit translations
        if: steps.pending.outputs.pending_count != '0'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: translate new/updated segments'
          branch: ${{ github.head_ref }}
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          push_options: '--force-with-lease'

      - name: Comment on PR
        if: steps.pending.outputs.pending_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Incremental translation completed and committed to this PR.'
            })

  notify_failure:
    needs: translate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Auto] Incremental translation failed',
              body: 'The translate-incremental workflow failed. Please check the workflow run for details.',
              labels: ['translation', 'failure', 'automated']
            })