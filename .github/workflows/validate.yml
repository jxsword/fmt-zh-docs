name: Validate Translations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'zh/**'
      - 'config/glossary.yml'
      - 'config/style-guide.md'
  push:
    branches: [main]
    paths:
      - 'zh/**'
      - 'config/glossary.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 每天早上 6 点 (UTC)

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run translation validation
        run: |
          python scripts/validate_translation.py

      - name: Run code example validation
        run: |
          python scripts/validate_code_examples.py || true

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short || true

      - name: Check markdown lint
        run: |
          # markdownlint-cli 是 npm 包（PyPI 无此名），经 npx 运行；`|| true` 首跑容忍历史告警
          npx -y markdownlint-cli2 "**/*.md" "#node_modules" "#site" "#pdf" || true

  quality-gate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Quality gate check
        run: |
          echo "Quality gate passed"
          # 这里可以添加更多质量门禁检查

  notify_failure:
    needs: [validate, quality-gate]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Auto] Validation failed',
              body: 'The validate workflow failed. Please check the workflow run for details.',
              labels: ['validation', 'failure', 'automated']
            })